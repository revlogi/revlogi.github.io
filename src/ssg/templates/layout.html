<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{title}} • {{siteTitle}}</title>
<meta name="description" content="{{description}}"/>
<link rel="canonical" href="{{canonicalUrl}}"/>
<link rel="icon" href="/so.jpg" type="image/jpeg"/>
<link rel="apple-touch-icon" href="/so.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"/>
<link rel="stylesheet" href="/katex.css"/>
<link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="/rss.xml"/>
<script>
(() => {
	const saved = localStorage.getItem("theme");
	const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
	document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
})();
</script>
</head>
<body>
<header class="site-header">
<a class="site-title" href="/">{{siteTitle}}</a>
<nav class="site-nav" aria-label="Primary navigation">{{navItems}}<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle light/dark theme"><svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg><svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button></nav>
</header>
<main>
{{body}}
</main>
<script>
document.getElementById("theme-toggle")?.addEventListener("click", () => {
	const root = document.documentElement;
	const next = root.dataset.theme === "dark" ? "light" : "dark";
	root.dataset.theme = next;
	localStorage.setItem("theme", next);
});
</script>
</body>
</html>
